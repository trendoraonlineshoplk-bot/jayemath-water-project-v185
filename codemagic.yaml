workflows:
  android-apk:
    name: Jayemath Water Project V185 APK
    max_build_duration: 120

    environment:
      android_signing:
        - jayemath_water_v185_new

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Check signing configuration
        script: |
          echo "Checking Android signing..."
          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"
          test -f "$CM_KEYSTORE_PATH"

      - name: Build signed Android APK
        script: |
          gradle :app:assembleRelease

    artifacts:
      - app/build/outputs/apk/release/app-release.apk
