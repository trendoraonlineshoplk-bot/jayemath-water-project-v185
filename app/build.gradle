plugins {
    id 'com.android.application' version '8.6.1' apply false
} tasks.register("prepareWebAssets") {
    doLast {
        def assetsDir = file("$projectDir/src/main/assets")
        assetsDir.mkdirs()

        ["index.html", "config.js", "sw.js", "manifest.webmanifest", "cover-768.png"].each { name ->
            copy {
                from rootProject.file(name)
                into assetsDir
            }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("prepareWebAssets")
}
