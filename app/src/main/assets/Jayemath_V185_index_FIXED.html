function addrNo(c){
  const a=String(c?.Address??c?.address??'').trim();
  const first=a.split(',')[0].trim();

  if(noMatch)return noMatch[1].trim();

}

function resolveCustomer(input){
  const v=normAccount(input);

  if(matches.length===1) return matches[0];

function searchNormalize(v){
  return String(v??'').toLowerCase().normalize('NFKC')
    .replace(/[‐‑‒–—−]/g,'-')
    .replace(/\s+/g,'')
    .replace(/[^a-z0-9]/g,'');
}
function addressSearchValues(x){
  const out=[];
  const add=v=>{const s=String(v??'').trim().toLowerCase();if(s&&!out.includes(s))out.push(s)};
  const addr=String(x?.Address??x?.address??'').trim();
  const account=String(x?.Account??x?.account??'').trim();
  add(addr); add(addr.split(',')[0]); add(addrNo(x)); add(account);
  (account.match(/\(([^)]+)\)/g)||[]).forEach(v=>add(v.replace(/^\(|\)$/g,'')));
  const raw=(addr+' '+account).replace(/[‐‑‒–—−]/g,'-');

  // Capture address/land numbers wherever they occur, including:
  // 1..300, 1A/1B/1C, 16/1B, 49/1 B, 66/11, FC1-1-2, H-01, etc.
  const matches=raw.match(/[A-Za-z]*\d[A-Za-z0-9]*(?:\s*[\/-]\s*[A-Za-z0-9]+)*/gi)||[];
  matches.forEach(v=>{
    add(v);
    String(v).split(/[\s,]+/).forEach(t=>add(t));
  });
  // Add every numeric component too, so 66 can find 66/11 and 66/2.
  (raw.match(/\d{1,3}/g)||[]).forEach(v=>add(v));

  const snapshot=[...out];
  snapshot.forEach(v=>{const c=searchNormalize(v);if(c&&!out.includes(c))out.push(c)});
  return out;
}
function addressNumberKeys(x){
  const vals=addressSearchValues(x);
  const keys=[];
  const add=v=>{const s=String(v??'').trim().toLowerCase();if(s&&!keys.includes(s))keys.push(s)};
  vals.forEach(v=>{const n=searchNormalize(v);if(!n)return;add(n);});
  return keys;
}
function addressBaseNumberKeys(x){
  const vals=addressSearchValues(x);
  const keys=[];
  const add=v=>{const s=String(v??'').trim();if(s&&!keys.includes(s))keys.push(s)};
  vals.forEach(v=>{const n=searchNormalize(v);if(!n)return;const m=n.match(/^(\d{1,3})/);if(m){const base=String(Number(m[1]));if(Number(base)>=1&&Number(base)<=300)add(base);}});
  return keys;
}
function customerSearchValues(x){
  const vals=[x?.Account,x?.account,x?.Name,x?.name,x?.Phone,x?.phone,x?.Address,x?.address,addrNo(x),displayAccount(x?.Account??x?.account)];
  return vals.filter(v=>v!=null&&String(v).trim()!=='').map(v=>String(v).trim().toLowerCase());
}
function addressSearchNumberMatch(x,q){
  const rawQ=String(q??'').trim().toLowerCase();
  const qn=searchNormalize(rawQ);
  if(!qn)return false;
  const keys=addressNumberKeys(x);
  const baseKeys=addressBaseNumberKeys(x);
  // Exact address variant, e.g. 90/1, 15/C, 66/11, 1A.
  if(keys.includes(qn))return true;
  // A plain number means the BASE address number only.
  // 90 matches 90 and 90/1, but does NOT match 90 in a phone number,
  // and 1 does NOT accidentally match the /1 part of 90/1.
  const qm=rawQ.match(/^(\d{1,3})$/);
  if(qm){
    const n=Number(qm[1]);
    if(n>=1&&n<=300&&baseKeys.includes(String(n)))return true;
  }
  return false;
}
function customerSearchMatch(x,q){
  if(!q)return true;
  const rawQ=String(q).trim().toLowerCase();
  const qNorm=searchNormalize(rawQ);

  // Address/land number search is intentionally strict. All numbers 1..300,
  // plus variants such as 15/C, 16/1B, 49/1 B, 66/11, 195/1A, etc., are
  // matched against the address number only, never against phone numbers.
  const looksLikeAddressNumber=/^\d{1,3}(?:\s*[\/\-]\s*[a-z0-9]+)*(?:\s*[a-z])?$/i.test(rawQ);
  if(looksLikeAddressNumber && addressSearchNumberMatch(x,rawQ)) return true;

  const vals=customerSearchValues(x);
  const addrVals=addressSearchValues(x);
  const all=[...vals,...addrVals];

  // For numeric/address-like queries, do not fall through to phone/name
  // substring matching; otherwise 90 could incorrectly return customers
  // whose phone number contains 90.
  if(looksLikeAddressNumber) return false;

  if(all.some(v=>v.includes(rawQ)))return true;
  if(qNorm && all.some(v=>searchNormalize(v).includes(qNorm)))return true;

  const tokens=rawQ.split(/\s+/).filter(Boolean);
  if(tokens.length>1 && tokens.every(t=>all.some(v=>v.includes(t)||searchNormalize(v).includes(searchNormalize(t)))))return true;
  return false;
}

}

function resetActiveMeterReading(account){
  const c=getCust(account); if(!c)return alert('Customer not found.');
  const m=activeMeter(c.Account); if(!m)return alert('No active meter registered.');
  const installDate=String(m.installed_date||'');
  const linked=(DB.readings||[]).filter(r=>{
    if(String(r.Account||r.account||'')!==String(c.Account)) return false;
    const rid=String(r.MeterId||'');
    const rd=String(r.ReadingDate||r.reading_date||'');
    return rid===String(m.id) || (!rid && installDate && rd>=installDate);
  });
  if(!linked.length){fillReadingCustomer();return alert('No saved reading exists for the current meter '+(m.meter_no||'')+'. Previous Reading is already '+Number(m.start_reading||0)+'.');}
  const ok=confirm('Reset saved readings for current meter '+(m.meter_no||'')+'?\n\nThis removes local readings linked to the CURRENT meter, plus any legacy/test readings for this account on or after the current meter installation date. Old meter readings before the installation date and all bills are not removed.');
  if(!ok)return;
  DB.readings=(DB.readings||[]).filter(r=>{
    if(String(r.Account||r.account||'')!==String(c.Account)) return true;
    const rid=String(r.MeterId||'');
    const rd=String(r.ReadingDate||r.reading_date||'');
    const remove=rid===String(m.id) || (!rid && installDate && rd>=installDate);
    return !remove;
  });
  persist();
  fillReadingCustomer();
  renderReadingHistory(c.Account);
  alert('Current meter readings were reset. Previous Reading is now '+Number(m.start_reading||0)+'.');
}
async function syncMeterNow(account){
  const c=getCust(account); if(!c)return alert('Customer not found.');
  const m=activeMeter(c.Account); if(!m)return alert('No active meter registered.');
  if(!SB)return alert('Cloud is not configured in this app package. Please use the latest V66 package.');
  if(!cloudUser)return openCloudConnect(()=>syncMeterNow(account));
  if(!['Super Admin','Staff'].includes(session?.role)){
    await loadCloudProfile();
    if(!['Super Admin','Staff'].includes(session?.role))return alert('This Cloud account is not Super Admin/Staff.');
  }
  const r=await syncOneMeterToCloud(m);
  if(r.ok){alert('☁ Meter '+(m.meter_no||'')+' is now saved in Cloud.');renderMeterManagement();}else alert('Cloud meter sync failed: '+r.msg);
}

function closeCloudConnect(){document.getElementById('cloudConnectModal')?.classList.remove('open');}
async function doCloudConnect(){
  const email=document.getElementById('cloudEmail')?.value||'';const password=document.getElementById('cloudPassword')?.value||'';const role=document.getElementById('cloudRole')?.value||'Super Admin';
  if(!email||!password)return alert('Enter Cloud email and password.');

  if(error)return alert('Cloud login failed: '+error.message);
  cloudUser=data?.user||null;await ensureCloudProfile();await loadCloudProfile();
  if(!['Super Admin','Staff'].includes(session?.role))return alert('This Cloud account is not registered as Super Admin/Staff.');
  localStorage.setItem(LS+'_session',JSON.stringify(session));closeCloudConnect();

}

function openMeterReplace(account){
  const c=getCust(account); if(!c)return alert('Customer not found.');
  const old=activeMeter(c.Account); const defaultFinal=old?latestReading(c.Account):'';
  openModal(`<h2>🔧 ${old?'Replace Meter':'Register First Meter'}</h2><p class="small"><b>Account:</b> ${esc(addrNo(c))} &nbsp; <b>Customer:</b> ${esc(c.Name)}</p><div class="formgrid">${old?`<label>Old Meter No.<input value="${esc(old.meter_no||'')}" readonly></label><label>Old Meter Final Reading<input id="mfFinal" type="number" min="0" step="1" value="${esc(defaultFinal)}"></label><label>Removal Date<input id="mfDate" type="date" value="${today()}"></label>`:''}<label>New Meter No.<input id="mnNo" placeholder="e.g. M-096-02"></label><label>New Meter Install Date<input id="mnDate" type="date" value="${today()}"></label><label>New Meter Starting Reading<input id="mnStart" type="number" min="0" step="1" value="0"></label><label>Reason<input id="mnReason" value="${old?'Meter damaged / replaced':'New connection'}"></label></div><div class="notice small">The customer Account Number stays <b>${esc(addrNo(c))}</b>. Old meter readings and bills remain in history. Only future readings use the new meter.</div><div class="toolbar section"><button class="btn good" onclick="saveMeterReplacement('${esc(c.Account)}','${old?esc(old.id):''}')">💾 Save Meter</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div><div id="meterMsg" class="small"></div>`);

function saveMeterReplacement(account,oldId){
  const c=getCust(account); if(!c)return;
  const newNo=(document.getElementById('mnNo')?.value||'').trim(); const date=document.getElementById('mnDate')?.value||today(); const start=Number(document.getElementById('mnStart')?.value||0); const reason=(document.getElementById('mnReason')?.value||'Meter replaced').trim();
  if(!Number.isFinite(start)||start<0){alert('Enter a valid new meter starting reading.');return;}
  if(oldId){const finalRaw=document.getElementById('mfFinal')?.value||'';const final=Number(finalRaw);const removed=document.getElementById('mfDate')?.value||date;if(finalRaw===''||!Number.isFinite(final)||final<0){alert('Enter the old meter final reading.');return;}const old=(DB.meters||[]).find(m=>String(m.id)===String(oldId));if(old){old.final_reading=final;old.removed_date=removed;old.status='Closed';old.reason=reason;}}
  if(!newNo){alert('Enter the new meter number.');return;}DB.meters??=[];const id='MTR-'+Date.now().toString(36).toUpperCase();const newMeter={id,Account:c.Account,Customer:c.Name,Address:c.Address,meter_no:newNo,installed_date:date,start_reading:start,status:'Active',reason};DB.meters.push(newMeter);persist();closeModal();render();setTimeout(async()=>{const a=document.getElementById('rmAccount');if(a){a.value=addrNo(c);renderMeterManagement();}if(SB&&cloudUser&&['Super Admin','Staff'].includes(session?.role)){const old=(DB.meters||[]).find(m=>String(m.id)===String(oldId));if(old&&old.status==='Closed'){const or=await syncOneMeterToCloud(old);if(!or.ok)return alert('Meter saved locally, but old meter Cloud update failed: '+or.msg);}const r=await syncOneMeterToCloud(newMeter);if(r.ok){alert((oldId?'Meter replaced':'Meter registered')+' successfully and saved to Cloud. Account Number remains '+addrNo(c)+'. Future readings will start from '+start+'.');}else alert((oldId?'Meter replaced':'Meter registered')+' locally. Cloud sync failed: '+r.msg);}else alert((oldId?'Meter replaced':'Meter registered')+' successfully. Account Number remains '+addrNo(c)+'. Future readings will start from '+start+'.');},30);
}

async function fillReadingCustomer(){
  const input=document.getElementById('ra'); if(!input)return;
  const c=getCust(input.value),hint=document.getElementById('readingHint');
  if(!c){document.getElementById('rp').value='';document.getElementById('ru').value='';if(hint)hint.textContent='Customer not found. Enter the Account Number / Address Number exactly as shown in Customers.';const h=document.getElementById('readingHistory');if(h)h.innerHTML='';return;}
  const meter=activeMeter(c.Account);
  let prev=latestReading(c.Account);
  // Cloud is the source of truth for the active meter. This prevents stale localStorage
  // readings (for example an old 4-unit test row) from becoming the previous reading.
  if(SB&&cloudUser&&['Super Admin','Staff'].includes(session?.role)&&meter){
    try{
      let q=SB.from('customers').select('id').eq('account',String(c.Account)).maybeSingle();
      let {data:cu,error:ce}=await q;
      if((ce||!cu)&&c.Address){const r=await SB.from('customers').select('id').eq('address',String(c.Address)).maybeSingle();cu=r.data;ce=r.error;}
      if(!ce&&cu?.id){
        let rq=SB.from('meter_readings').select('id,reading_date,previous_reading,current_reading,units').eq('customer_id',cu.id).eq('meter_id',meter.CloudId||'').order('reading_date',{ascending:false}).order('billing_date',{ascending:false}).limit(1).maybeSingle();
        const rr=await rq;
        if(!rr.error&&rr.data&&Number.isFinite(Number(rr.data.current_reading))){
          prev=Number(rr.data.current_reading);
          const local=(DB.readings||[]).find(r=>String(r.MeterId||'')===String(meter.id)&&String(r.Account||r.account||'')===String(c.Account)&&String(r.ReadingDate||r.reading_date||'')===String(rr.data.reading_date));
          if(local){local.PreviousReading=Number(rr.data.previous_reading||0);local.CurrentReading=Number(rr.data.current_reading||0);local.Units=Number(rr.data.units||0);}
          else {DB.readings.push({Account:c.Account,Customer:c.Name,Address:c.Address,MeterId:meter.id,MeterNo:meter.meter_no,ReadingDate:String(rr.data.reading_date),PreviousReading:Number(rr.data.previous_reading||0),CurrentReading:Number(rr.data.current_reading||0),Units:Number(rr.data.units||0),BillingMonth:String(rr.data.reading_date).slice(0,7),CreatedAt:new Date().toISOString()});}
          persist();
        }
      }
    }catch(e){console.warn('Cloud active meter reading refresh failed',e)}
  }
  document.getElementById('rp').value=prev;document.getElementById('rc').min=prev;document.getElementById('ru').value='';
  if(hint)hint.innerHTML=`Customer: <b>${esc(c.Name)}</b> &nbsp; Address: <b>${esc(c.Address)}</b> &nbsp; Phone: <b>${esc(c.Phone||'—')}</b> &nbsp; ${meter?`Active Meter: <b>${esc(meter.meter_no||'—')}</b> &nbsp; Installed: <b>${esc(meter.installed_date||'')}</b> &nbsp; `:''}Previous reading: <b>${prev}</b>`;
  renderReadingHistory(c.Account);
}

async function refreshCloudBillingCustomer(c){

    let data=null,error=null;

function refreshPaymentHistory(){render();setTimeout(function(){const el=document.getElementById('pa');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},0)}
function showPayBalance(){const el=document.getElementById('pa');const out=document.getElementById('pbal');if(!el||!out)return;const c=resolveCustomer(el.value);out.value=c?Number(c.Balance||0):'';}
async function savePayment(){
  const entered=(document.getElementById('pa')?.value||'').trim();
  const c=resolveCustomer(entered);
  const amt=Number(document.getElementById('pamt')?.value||0);
  if(!c||amt<=0){alert('Enter a valid Address Number and payment amount. Example: 16/1B');return;}
  const a=String(c.Account||'').trim();
  const paymentDate=document.getElementById('pd').value||today();
  const method=document.getElementById('pm').value||'Cash';
  const before=Number(c.Balance||0);
  if(before<=0){alert('This customer has no outstanding balance locally.');return;}
  const actual=Math.min(amt,before);
  const receipt='R'+Date.now().toString().slice(-8);
  let remaining=actual;
  (DB.billing||[]).filter(x=>String(x.Account||'').trim()===a).sort((x,y)=>String(x.BillingMonth||x.Date).localeCompare(String(y.BillingMonth||y.Date))).forEach(function(b){
    if(remaining<=0)return; let due=Number(b.Balance??b.Total??0); if(due<=0)return;
    const applied=Math.min(remaining,due); b.Paid=Number(b.Paid||0)+applied; b.Balance=due-applied; b.Status=b.Balance<=0?'Paid':'Part Paid'; remaining-=applied;
  });
  c.Balance=Math.max(0,before-actual);
  const pay={date:paymentDate,receipt,account:a,amount:actual,method,status:'Success',balanceAfter:Math.max(0,before-actual)};
  DB.payments??=[];DB.payments.push(pay);
  DB.sms??=[];DB.sms.push({date:today(),account:a,type:'payment',status:'Outbox',message:buildPaymentSMS(pay,c)});
  persist();
  setPaymentViewAccount(a);
  if(!navigator.onLine||!SB||!cloudUser||!['Super Admin','Staff'].includes(session?.role)){
    queueOffline('payment',pay);
    document.getElementById('pbal').value=c.Balance;
    document.getElementById('paymsg').innerHTML='<div class="notice">📵 Payment saved locally. It will sync to Supabase automatically when Internet returns.</div>';
    render();
    setTimeout(()=>{try{printReceipt(a,actual,receipt,paymentDate,c.Balance,method);}catch(e){console.error('Payment receipt print error:',e);}},300);
    return;
  }
  try{
    let res=await SB.from('customers').select('id,account,address,current_balance').eq('account',a).maybeSingle();
    if((res.error||!res.data) && c.Address){const prefix=String(c.Address||'').split(',')[0].trim();if(prefix){const rr=await SB.from('customers').select('id,account,address,current_balance').ilike('address',prefix+',%').limit(2);if(!rr.error&&Array.isArray(rr.data)&&rr.data.length===1)res={error:null,data:rr.data[0]};}}
    if(res.error||!res.data)throw new Error('Customer not found in Supabase: '+(res.error?.message||a));
    const cc=res.data;
    const pe=await SB.from('payments').insert({customer_id:cc.id,receipt_no:receipt,amount:actual,method,payment_date:paymentDate+'T12:00:00',status:'Success',created_by:cloudUser?.id||null,created_by_name:session?.display_name||session?.name||cloudUser?.email||null}).select('id').single();
    if(pe.error)throw pe.error;
    if(typeof auditStaffAction==='function')await auditStaffAction('Payment','Create',pe.data?.id,cc.id,a,{receipt,amount:actual,method});
    const cloudBalance=Math.max(0,Number(cc.current_balance||0)-actual);
    const ue=await SB.from('customers').update({current_balance:cloudBalance}).eq('id',cc.id);if(ue.error)throw ue.error;
    c.Balance=cloudBalance;pay.balanceAfter=cloudBalance;persist();setPaymentViewAccount(a);
    document.getElementById('pbal').value=cloudBalance;
    document.getElementById('paymsg').innerHTML='<div class="notice">☁ Payment saved to Supabase. Receipt: <b>'+esc(receipt)+'</b></div>';
    render();
    setTimeout(()=>{try{printReceipt(a,actual,receipt,paymentDate,cloudBalance,method);}catch(e){console.error('Payment receipt print error:',e);}},300);
  }catch(e){
    queueOffline('payment',pay);persist();
    document.getElementById('paymsg').innerHTML='<div class="notice">⚠ Payment saved locally. Cloud sync failed and was queued: '+esc(e.message)+'</div>';
    render();
    setTimeout(()=>{try{printReceipt(a,actual,receipt,paymentDate,c.Balance,method);}catch(err){console.error('Payment receipt print error:',err);}},300);
  }
}

function buildBillSMS(bill,c){
  c=c||{};
  const account=addrNo(c)||bill?.Account||'';
  const name=c?.Name||bill?.Customer||'';
  const month=bill?.BillingMonth||bill?.billing_month||today().slice(0,7);
  const prev=Number(bill?.['Previous Reading']??bill?.previous_reading??0);
  const curr=Number(bill?.['Current Reading']??bill?.current_reading??0);
  const units=Number(bill?.Units??bill?.units??Math.max(0,curr-prev));
  const water=Number(bill?.WaterCharge??bill?.water_charge??0);
  const fixed=Number(bill?.FixedCharge??bill?.fixed_charge??50);
  const arrears=Number(bill?.Arrears??bill?.arrears??bill?.PreviousOutstanding??bill?.previous_outstanding??0);
  const other=Number(bill?.OtherCharge??bill?.other_charge??0);
  const total=Number(bill?.Total??bill?.total??(water+fixed+arrears+other));
  return `ජයමෙත් පානීය ජල පාරිභෝගික කමිටුව\nAccount No: ${account}\nCustomer: ${name}\nBilling Month: ${month}\nPrevious Reading: ${prev}\nCurrent Reading: ${curr}\nUnits Used: ${units} m³\nWater Charge: ${money(water)}\nFixed Charge: ${money(fixed)}\nPrevious Outstanding: ${money(arrears)}\nOther Charge: ${money(other)}\nTOTAL AMOUNT DUE: ${money(total)}\nස්තුතියි!`;
}

function openOnlinePayment(account){

function cleanDate(v){
  if(!v) return '';
  const s=String(v).trim();
  let d=null;
  if(/^\d{4}-\d{2}-\d{2}T/.test(s)) d=new Date(s);
  else if(/^\d{4}-\d{2}-\d{2}$/.test(s)) d=new Date(s+'T00:00:00');
  if(d && !isNaN(d)){
    const dd=String(d.getDate()).padStart(2,'0'), mm=String(d.getMonth()+1).padStart(2,'0');
    return `${dd}/${d.getFullYear()===0?'':String(d.getFullYear())}`.replace('undefined','') && `${dd}/${mm}/${d.getFullYear()}`;
  }
  return s;
}

/* V38 SMS integration layer */
function smsPhone(c){
  const raw=String(c?.Phone??c?.phone??'').replace(/\D/g,'');
  if(!raw)return '';
  if(raw.startsWith('94'))return raw;
  if(raw.startsWith('0'))return '94'+raw.slice(1);
  if(raw.length===9)return '94'+raw;
  return raw;
}
function smsSettings(){
  DB.settings=Object.assign({smsProvider:'Text.lk',smsSenderId:'JAYEMATH',autoBillSMS:true,autoPaymentSMS:true,autoReminderSMS:false},DB.settings||{});
  // Automatic bill/payment SMS is enabled by default for this production workflow.
  DB.settings.autoBillSMS=true;
  DB.settings.autoPaymentSMS=true;
  if(!String(DB.settings.smsSenderId||'').trim()) DB.settings.smsSenderId='JAYEMATH';
  return DB.settings;
}
function queueSMS(account,type,message){
  DB.sms.push({date:today(),account,type,status:'Outbox',message});
  persist();
}
async function sendOneSMS(item){
  if(!hasCloud()||!SB){item.status='Failed';item.error='Supabase is not connected.';persist();return false;}
  let c=getCust(item.account);
  // If the local customer cache does not contain the account, resolve it from Cloud.
  if(!c && SB && cloudUser){
    try{
      const q=await SB.from('customers').select('account,name,address,phone,current_balance,status,status_reason').eq('account',String(item.account)).maybeSingle();
      if(q.data){c={Account:q.data.account,Name:q.data.name,Address:q.data.address,Phone:q.data.phone,Balance:q.data.current_balance};}
    }catch(e){}
  }
  const recipient=smsPhone(c);
  if(!recipient){item.status='Failed';item.error='Customer phone number is missing.';persist();return false;}
  const st=smsSettings();
  const sender=String(st.smsSenderId||'JAYEMATH').trim()||'JAYEMATH';
  try{
    const {data,error}=await SB.functions.invoke('send-sms',{body:{recipient,sender_id:sender,message:item.message}});
    if(error)throw error;
    if(data?.status==='error')throw new Error(data.message||'SMS provider error');
    item.status='Sent';item.sentAt=new Date().toISOString();item.providerId=data?.data?.uid||data?.uid||'';delete item.error;
    persist();return true;
  }catch(e){item.status='Failed';item.error=e?.message||String(e);persist();return false;}
}
function holdPendingSMS(){const n=DB.sms.filter(x=>x.status==='Outbox').length;if(!n){alert('No pending SMS to hold.');return;}if(!confirm('Hold '+n+' pending SMS so they cannot be sent accidentally?'))return;DB.sms.forEach(x=>{if(x.status==='Outbox')x.status='Held'});persist();render();alert(n+' pending SMS moved to Held.');}
async function autoSendBillSMS(item){if(!item)return;try{smsSettings();await sendOneSMS(item);}catch(e){item.status='Failed';item.error=e?.message||String(e);persist();}}

async function sendPendingSMS(){
  const pending=DB.sms.filter(x=>x.status==='Outbox');
  if(!pending.length){alert('No pending SMS in Outbox.');return;}
  if(!hasCloud()){alert('Supabase connection is required for real SMS sending.');return;}
  let ok=0,fail=0;
  for(const item of pending){if(await sendOneSMS(item))ok++;else fail++;}
  render();
  alert(`SMS sending complete. Sent: ${ok} | Failed: ${fail}`);
}
function findCustomerByAddressNumber(addressNumber){

    return normalized===target;
  });
  return matches.length===1?matches[0]:null;
}

/* V122 XP-P301A Bluetooth ESC/POS direct printing via Web Serial.
   Windows Bluetooth SPP must expose the paired printer as a COM port.
   Chrome/Edge on HTTPS (or localhost) is required. */
let xpSerialPort=null, xpSerialWriter=null;
function xpSerialSupported(){return 'serial' in navigator;}
function xpSerialStatus(){return document.getElementById('xpSerialStatus');}
function setXpSerialStatus(msg,ok=false){const el=xpSerialStatus();if(el){el.textContent=msg;el.className='small '+(ok?'goodtxt':'muted');}}
async function connectXPPrinter(){
  if(!xpSerialSupported()){alert('මේ direct Bluetooth print feature එක Chrome/Edge HTTPS (හෝ localhost) browser එකක පමණක් support කරයි.');return;}
  try{
    if(xpSerialPort && xpSerialPort.readable){setXpSerialStatus('Connected ✓',true);return;}
    xpSerialPort=await navigator.serial.requestPort();
    const baud=Number(document.getElementById('xpBaud')?.value||9600);
    await xpSerialPort.open({baudRate:baud,dataBits:8,stopBits:1,parity:'none',flowControl:'none'});
    xpSerialWriter=xpSerialPort.writable.getWriter();
    setXpSerialStatus('Connected ✓ — Xprinter COM port ready',true);
    localStorage.setItem('JAYEMATH_XP_BAUD',String(baud));
  }catch(e){xpSerialPort=null;xpSerialWriter=null;setXpSerialStatus('Not connected');if(e?.name!=='NotFoundError')alert('Xprinter connect failed: '+(e?.message||e));}
}
async function disconnectXPPrinter(){try{if(xpSerialWriter){xpSerialWriter.releaseLock();xpSerialWriter=null;}if(xpSerialPort){await xpSerialPort.close();}}catch(e){}xpSerialPort=null;setXpSerialStatus('Not connected');}
function xpBytes(str){return new TextEncoder().encode(str);}
function xpEsc(){return new Uint8Array([0x1b,0x40]);}
function xpAlign(n){return new Uint8Array([0x1b,0x61,n]);}
function xpBold(on){return new Uint8Array([0x1b,0x45,on?1:0]);}
function xpCut(){return new Uint8Array([0x1d,0x56,0x00]);}
function xpConcat(...parts){const len=parts.reduce((n,a)=>n+a.length,0);const out=new Uint8Array(len);let o=0;for(const a of parts){out.set(a,o);o+=a.length;}return out;}
function xpLine(label,val,width=31){label=String(label||'');val=String(val??'');const space=Math.max(1,width-label.length-val.length);return label+' '.repeat(space)+val+'\n';}

async function xpWrite(data){
  if(!xpSerialWriter) throw new Error('Xprinter is not connected.');
  await xpSerialWriter.write(data);
}
async function xpDirectPrintBill(account,month){

/* V101 FINAL: authoritative current-month Full Bill SMS. Prefer exact Supabase bill, then exact local bill. */
async function getAuthoritativeBillForSMS(account, month){
  const c=getCust(account); if(!c) return null;
  const m=String(month||today().slice(0,7)).slice(0,7);
  // 1) If cloud/admin connection is active, fetch the exact saved bill for this customer and month.
  if(SB && cloudUser){
    try{
      let customerId=c.CloudId||null;
      if(!customerId){
        let q=await SB.from('customers').select('id').eq('account',String(c.Account)).maybeSingle();
        if(!q?.data && c.Address) q=await SB.from('customers').select('id').eq('address',String(c.Address)).maybeSingle();
        customerId=q?.data?.id||null;
      }
      if(customerId){
        const q=await SB.from('bills')
          .select('id,account,customer_name,address,billing_date,billing_month,previous_reading,current_reading,units,water_charge,fixed_charge,arrears,other_charge,total,status')
          .eq('customer_id',customerId)
          .gte('billing_month',m+'-01')
          .lt('billing_month',m+'-01')
          .limit(1);
        // The range above is intentionally replaced below; it avoids any cross-month fallback.
        const exact=await SB.from('bills')
          .select('id,account,customer_name,address,billing_date,billing_month,previous_reading,current_reading,units,water_charge,fixed_charge,arrears,other_charge,total,status')
          .eq('customer_id',customerId)
          .eq('billing_month',m+'-01')
          .order('billing_date',{ascending:false})
          .limit(1)
          .maybeSingle();
        if(exact?.data) return exact.data;
      }
    }catch(e){ console.warn('V100 exact cloud bill lookup failed',e); }
  }
  // 2) Local fallback: exact billing month only.
  return findBillForSMS(account,m);
}
