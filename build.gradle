plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jayemath.waterprint'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jayemath.waterprint'
        minSdk 23
        targetSdk 35
        versionCode 185
        versionName 'V185'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
    }
}

tasks.register('prepareWebAssets') {
    doLast {
        def assetsDir = file("$projectDir/src/main/assets")
        assetsDir.mkdirs()

        ['index.html', 'config.js', 'sw.js', 'manifest.webmanifest', 'cover-768.png'].each { name ->
            copy {
                from rootProject.file(name)
                into assetsDir
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn('prepareWebAssets')
}
